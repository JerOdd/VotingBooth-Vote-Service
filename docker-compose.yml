# Local dependencies for the job and the API: Postgres, plus SeaweedFS as an S3-compatible store standing in for OVH Object Storage.
# (MinIO no longer publishes public Docker images.)
services:
  postgres:
    image: postgres:16
    container_name: vote-postgres
    restart: always
    # 5435 on the host: representative-service uses 5433 and law-service 5434.
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: votes
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d votes"]
      interval: 2s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # Local only: login users for the job and the API, as members of the group roles the migrations grant to.
  # In other environments the infrastructure creates them, with their own passwords. Inline, so nothing is mounted.
  postgres-init:
    image: postgres:16
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: postgres
    entrypoint: >
      psql -h postgres -U postgres -d votes -v ON_ERROR_STOP=1 -c "
        DO $$$$ BEGIN
          IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'vote_job') THEN CREATE ROLE vote_job NOLOGIN; END IF;
          IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'vote_api') THEN CREATE ROLE vote_api NOLOGIN; END IF;
          IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'vote_job_login') THEN
            CREATE ROLE vote_job_login LOGIN PASSWORD 'vote-job' IN ROLE vote_job;
          END IF;
          IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'vote_api_login') THEN
            CREATE ROLE vote_api_login LOGIN PASSWORD 'vote-api' IN ROLE vote_api;
          END IF;
        END $$$$;"

  s3:
    image: chrislusf/seaweedfs:4.48
    container_name: vote-s3
    restart: always
    # SeaweedFS rejects signed requests unless an identity is configured, even locally.
    # The file is written at startup, so nothing has to be mounted from the project folder.
    environment:
      S3_IDENTITY: >-
        {"identities": [{"name": "local",
                         "credentials": [{"accessKey": "local", "secretKey": "local-secret"}],
                         "actions": ["Admin", "Read", "Write", "List", "Tagging"]}]}
    entrypoint: ["sh", "-c", "echo \"$$S3_IDENTITY\" > /tmp/s3.json && exec weed server -s3 -s3.config=/tmp/s3.json -dir=/data"]
    # 9002 on the host: representative-service's S3 uses 9000 and law-service's 9001.
    ports:
      - "9002:8333"
    volumes:
      - s3-data:/data

  # Creates the raw bucket with versioning on, as it must be on OVH.
  s3-init:
    image: amazon/aws-cli:2.27.50
    depends_on:
      - s3
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local-secret
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      sh -c "until aws --endpoint-url http://s3:8333 s3api list-buckets > /dev/null 2>&1; do sleep 1; done;
             aws --endpoint-url http://s3:8333 s3api create-bucket --bucket vote-raw || true;
             aws --endpoint-url http://s3:8333 s3api put-bucket-versioning --bucket vote-raw --versioning-configuration Status=Enabled"

volumes:
  postgres-data:
  s3-data:
