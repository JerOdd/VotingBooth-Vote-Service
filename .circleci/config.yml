# This config was automatically generated from your source code
# Stacks detected: deps:java:.
version: 2.1
orbs:
  docker: circleci/docker@2.1.4
jobs:
  build-and-test:
    docker:
      - image: cimg/openjdk:21.0
    steps:
      - checkout
      - run:
          name: Build
          command: mvn -B -DskipTests clean package
      - run:
          name: Test
          command: mvn -B test
  deploy-docker-image:
    executor:
      name: docker/docker
      tag: "3.6"
    steps:
      - checkout
      - docker/install-docker-tools
      - setup_remote_docker:
          version: 20.10.14
          docker_layer_caching: true

      - run:
          name: "Build and push Docker images"
          command: |
            docker login -u $DOCKER_USER -p $DOCKER_PASS $DOCKER_REGISTRY
            docker build -f api/Dockerfile -t $DOCKER_REGISTRY/vote-api:latest .
            docker push $DOCKER_REGISTRY/vote-api:latest
            docker build -f job/Dockerfile -t $DOCKER_REGISTRY/vote-job:latest .
            docker push $DOCKER_REGISTRY/vote-job:latest

workflows:
  test:
    when:
      not:
        equal: [ develop, << pipeline.git.branch >> ]
    jobs:
      - build-and-test
  test-and-deploy:
    when:
      equal: [ develop, << pipeline.git.branch >> ]
    jobs:
      - build-and-test
      - deploy-docker-image:
          context: VotingBooth
          requires:
            - build-and-test
