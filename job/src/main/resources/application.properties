spring.application.name=vote-job
# The law service's JSON, like every VotingBooth API.
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
# A legislature is about 1.3 million representative votes, inserted in JDBC batches: the driver rewrites each batch as one INSERT.
spring.datasource.hikari.data-source-properties.reWriteBatchedInserts=true

# Synced in this order; L16 is the history and its archive no longer changes.
assemblee-nationale.legislatures=17,16
assemblee-nationale.scrutins-archive-url=https://data.assemblee-nationale.fr/static/openData/repository/{legislature}/loi/scrutins/Scrutins.json.zip
# Some of the Assemblée's servers serve an archive hours older than others: an older download is retried, then the run is skipped.
assemblee-nationale.stale-archive-attempts=3
assemblee-nationale.stale-archive-retry-delay=PT1M

# Run once and exit by default (Kubernetes CronJob). Set vote.sync.schedule.enabled=true to stay up and sync on the cron.
vote.sync.schedule.enabled=false
vote.sync.cron=0 0 4 * * *
vote.sync.zone=Europe/Paris

# law-api, for the scrutins each law was voted in (GET /vote-links).
clients.law.base-url=${LAW_API_URL}

# S3-compatible raw storage (OVH Object Storage). Credentials come from the environment, never from this file.
storage.endpoint=${STORAGE_ENDPOINT}
storage.region=${STORAGE_REGION}
storage.bucket=${STORAGE_BUCKET}
storage.access-key=${STORAGE_ACCESS_KEY}
storage.secret-key=${STORAGE_SECRET_KEY}
storage.path-style=false
storage.require-versioning=true
