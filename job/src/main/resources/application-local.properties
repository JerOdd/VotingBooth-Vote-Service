# Postgres from docker-compose.yml. The job connects as a member of vote_job (no access to the citizen schema);
# Flyway runs as the database owner.
spring.datasource.url=jdbc:postgresql://localhost:5435/votes
spring.datasource.username=vote_job_login
spring.datasource.password=vote-job
spring.flyway.user=postgres
spring.flyway.password=postgres

# SeaweedFS from docker-compose.yml, with the identity declared in its s3 service.
# 9002 on the host: representative-service's S3 uses 9000 and law-service's 9001.
storage.endpoint=http://localhost:9002
storage.region=us-east-1
storage.bucket=vote-raw
storage.access-key=local
storage.secret-key=local-secret
storage.path-style=true
